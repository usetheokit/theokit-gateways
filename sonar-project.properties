# SonarQube Cloud analysis scope, generated from this repository's real layout.
#
# Source roots are stated explicitly rather than discovered. Left to discovery the scanner
# also reads build output and reports duplication between a source file and its own bundle
# — measured on theokit-tui (B-126).

sonar.projectKey=usetheokit_theokit-gateways
sonar.organization=usetheokit

sonar.sources=integration/src,packages/gateway-discord/src,packages/gateway-email/src,packages/gateway-line/src,packages/gateway-matrix/src,packages/gateway-mattermost/src,packages/gateway-slack/src,packages/gateway-sms/src,packages/gateway-teams/src,packages/gateway-telegram/src,packages/gateway-whatsapp/src,packages/gateway/src
sonar.tests=integration/tests,packages/gateway-discord/tests,packages/gateway-email/tests,packages/gateway-line/tests,packages/gateway-matrix/tests,packages/gateway-mattermost/tests,packages/gateway-slack/tests,packages/gateway-sms/tests,packages/gateway-teams/tests,packages/gateway-telegram/tests,packages/gateway-whatsapp/tests,packages/gateway/tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
# `.github/**` is excluded because this repository already gates it with the tools that
# understand it. `lint / actionlint + zizmor` is a REQUIRED check and it passes: zizmor reads the
# `# zizmor: ignore[unpinned-uses]` annotations, which is where the decision to track
# `usetheokit/shared-workflows@v1` is recorded and argued — SHA-pinning defends against a THIRD
# PARTY moving a ref, and that is the same organisation. A generic rule cannot see that annotation,
# so it reports the decision as a vulnerability every time it is honoured.
#
# This is not narrowing the gate. `sonar.sources` above already declares the scope as the `src`
# trees and nothing else; the exclusion states the same boundary in the form the automatic analysis
# reads, so the two stop disagreeing about what this project asked to be analysed.
sonar.exclusions=**/dist/**,**/build/**,**/coverage/**,**/node_modules/**,**/*.d.ts,**/*.stories.tsx,wiki/**,.github/**,.changeset/**

# Written by the coverage run. A path listed here that the build never writes reports
# 0% while the suite is green, and that number is indistinguishable from a measured one.
sonar.javascript.lcov.reportPaths=integration/coverage/lcov.info,packages/gateway-discord/coverage/lcov.info,packages/gateway-email/coverage/lcov.info,packages/gateway-line/coverage/lcov.info,packages/gateway-matrix/coverage/lcov.info,packages/gateway-mattermost/coverage/lcov.info,packages/gateway-slack/coverage/lcov.info,packages/gateway-sms/coverage/lcov.info,packages/gateway-teams/coverage/lcov.info,packages/gateway-telegram/coverage/lcov.info,packages/gateway-whatsapp/coverage/lcov.info,packages/gateway/coverage/lcov.info,tools/coverage/lcov.info

sonar.sourceEncoding=UTF-8
