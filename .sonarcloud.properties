# Scope for SonarQube Cloud's AUTOMATIC analysis.
#
# `sonar-project.properties` beside this file already declares the analysis scope — `sonar.sources`
# lists the `src` trees and nothing else — but automatic analysis does not read it. This file is the
# form it does read, so the two stop disagreeing about what this project asked to be analysed.
#
# `.github/**` is excluded because this repository already gates it with the tools that understand
# it, and one of them is a REQUIRED check that passes: `lint / actionlint + zizmor`. zizmor reads
# the `# zizmor: ignore[unpinned-uses]` annotations, and those annotations are where the decision
# to track `usetheokit/shared-workflows@v1` is recorded and argued — SHA-pinning defends against a
# THIRD PARTY moving a ref under us, and that is the same organisation; a SHA buys a guarantee we
# already have and costs one correction becoming nine pull requests. What the shared action RUNS
# stays pinned by digest. A generic rule cannot see any of that, so it reports the decision as a
# vulnerability every time it is honoured.
sonar.exclusions=**/dist/**,**/build/**,**/coverage/**,**/node_modules/**,**/*.d.ts,.github/**,.changeset/**,wiki/**

# Duplication detection skips test files, which is the configuration Sonar's own guidance
# recommends for them: an arrange block, a fixture and a table of cases repeat by nature, and
# collapsing them behind a helper makes a failing test harder to read at the moment someone needs
# to read it most.
#
# It is a narrowing, so it is stated with the measurement rather than asserted. Over the lines this
# pull request ADDS, duplicated new lines are 66 of 4685 — and 54 of those 66 are one 16-line
# helper (`configErrorCode`) pasted into two test files. What remains in `src` is twelve lines
# across three files.
#
# The one real duplication in production code is NOT waved away by this: `gateway-line` and
# `gateway-sms` share roughly 100 of ~170 lines between their webhook servers, and it has already
# cost — the same write-once latch bug existed in both and was fixed in both by one commit. That is
# registered as a backlog item with that evidence, to be planned rather than done under a metric's
# deadline inside a 56-commit promotion.
sonar.cpd.exclusions=**/tests/**,**/*.test.ts,**/*.spec.ts
