name: Integration (live)

# Live tests against the real platform APIs, with real credentials.
#
# Deliberately NOT on pull_request. Three reasons, each sufficient:
#
#  - Secrets are not available to workflows triggered by a fork PR, so the suite
#    would skip everything and report a green tick that means nothing.
#  - These send real messages and, for SMS, spend real money on every run.
#  - A provider having a bad afternoon is not a reason to turn a contributor's
#    PR red. `ci.yml` is the gate for changes; this one watches the contracts.
#
# It runs nightly, so a platform changing its API surface is found by a schedule
# rather than by a user, and on demand when you want to confirm a fix.

on:
  schedule:
    # 04:00 UTC — outside working hours in America/Sao_Paulo, where the
    # throwaway chats live.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      platform:
        description: "Single platform id (telegram, discord, slack, …). Empty runs all."
        required: false
        type: string
  # Callable so `release.yml` can gate a publish on the live suites instead of
  # duplicating them. The suite is defined once, here.
  workflow_call:
    inputs:
      platform:
        description: "Single platform id. Empty runs all."
        required: false
        type: string
    # Declared one by one instead of taking `secrets: inherit` from the caller.
    # `inherit` hands the called workflow EVERY secret the caller holds — including
    # the registry credential the release job uses, which these live tests must
    # never see. Listing them keeps the blast radius of this workflow to the
    # platform credentials it actually talks to.
    secrets:
      DISCORD_BOT_TOKEN:
        required: false
      DISCORD_TEST_CHANNEL_ID:
        required: false
      DISCORD_TEST_SENDER_TOKEN:
        required: false
      EMAIL_ADDRESS:
        required: false
      EMAIL_IMAP_HOST:
        required: false
      EMAIL_PASSWORD:
        required: false
      EMAIL_SMTP_HOST:
        required: false
      EMAIL_TEST_RECIPIENT:
        required: false
      EMAIL_TEST_SENDER_ADDRESS:
        required: false
      EMAIL_TEST_SENDER_PASSWORD:
        required: false
      EMAIL_TEST_SENDER_SMTP_HOST:
        required: false
      LINE_CHANNEL_ACCESS_TOKEN:
        required: false
      LINE_CHANNEL_SECRET:
        required: false
      LINE_TEST_USER_ID:
        required: false
      MATRIX_ACCESS_TOKEN:
        required: false
      MATRIX_HOMESERVER_URL:
        required: false
      MATRIX_TEST_ROOM_ID:
        required: false
      MATRIX_USER_ID:
        required: false
      MATTERMOST_ACCESS_TOKEN:
        required: false
      MATTERMOST_BASE_URL:
        required: false
      MATTERMOST_TEST_CHANNEL_ID:
        required: false
      SLACK_APP_TOKEN:
        required: false
      SLACK_BOT_TOKEN:
        required: false
      SLACK_TEST_CHANNEL_ID:
        required: false
      SLACK_TEST_USER_TOKEN:
        required: false
      SMS_ACCOUNT_ID:
        required: false
      SMS_AUTH_TOKEN:
        required: false
      SMS_BACKEND:
        required: false
      SMS_FROM_NUMBER:
        required: false
      SMS_TEST_RECIPIENT:
        required: false
      TEAMS_CLIENT_ID:
        required: false
      TEAMS_CLIENT_SECRET:
        required: false
      TEAMS_TENANT_ID:
        required: false
      TEAMS_TEST_CONVERSATION_ID:
        required: false
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_TEST_CHAT_ID:
        required: false
      # TELEGRAM_TEST_SESSION / TELEGRAM_API_ID / TELEGRAM_API_HASH are ABSENT
      # by decision, not by oversight — see the block above the Telegram
      # variables in the `Live suites` step.
      WHATSAPP_ACCESS_TOKEN:
        required: false
      WHATSAPP_PHONE_NUMBER_ID:
        required: false
      WHATSAPP_TEST_RECIPIENT:
        required: false

permissions:
  contents: read

concurrency:
  # Never two live runs at once: they would race for the same test chat and
  # interleave their messages.
  group: integration-live
  cancel-in-progress: false

jobs:
  live:
    name: Live platform contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Deliberately still named `e2e` after the suite was renamed to
    # `integration`. This is a GitHub Environment holding 16 secrets, and secret
    # values are write-only — nobody can read them to copy them into a
    # differently-named environment. Renaming it here without recreating it
    # there silently strips every credential and the whole suite skips.
    #
    # Rename it only by re-entering all 16 secrets by hand, which buys tidiness
    # and risks a green run that tested nothing.
    environment: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        # No `version:` here on purpose. The action reads `packageManager` from
        # package.json, which is already the single authority on the pnpm version.
        # Pinning it a second time in this file creates two places to update, and
        # once they disagree action-setup aborts with ERR_PNPM_BAD_PM_VERSION.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          # The cache key must change when the package manager does. setup-node keys the
          # pnpm store on the lockfile alone, so a pnpm 9 -> 10 bump leaves the key
          # identical and the job restores a store the new pnpm reads as inconsistent —
          # `ERR_PNPM_MISSING_PACKAGE_INDEX_FILE`, on a package the lockfile does list.
          # package.json carries `packageManager`, so including it ties the cache to the
          # pnpm that wrote it.
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
      - run: pnpm install --frozen-lockfile
      # The adapters import @theokit/gateway, whose types come from its build.
      - run: pnpm build

      # Always runs, with or without secrets: it prints which platforms are
      # wired up and what each missing one still needs. When a credential
      # expires this is the line in the log that says so.
      - name: Readiness report
        run: pnpm --filter @theokit/gateway-integration readiness
        env:
          INTEGRATION_LIVE: "1"
          # Same names as `integration/.env`, so a suite never knows which source it got.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID }}
          # Telegram inbound is NOT wired here, deliberately (decided 2026-08-17,
          # re-affirmed 2026-08-22). Driving it needs TELEGRAM_TEST_SESSION — an
          # MTProto session string, which is full access to a Telegram ACCOUNT
          # rather than a scoped token — plus the TELEGRAM_API_ID / API_HASH that
          # are useless without it.
          #
          # The decision used to live only in a comment in
          # `integration/tests/telegram/live.test.ts`, while these three lines sat
          # here fully wired. That made the decision conventional: the only thing
          # enforcing it was nobody having filled the secret in, and whoever did
          # would have started shipping an account credential into CI with no
          # review and no signal. Not referencing them is what makes it structural.
          #
          # Restoring this is three lines, on the day the trade changes and against
          # a THROWAWAY account. See `integration/README.md § Running with nobody
          # watching`.
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_TEST_CHANNEL_ID: ${{ secrets.DISCORD_TEST_CHANNEL_ID }}
          # A SECOND bot in the same server. normalizeEvent drops messages
          # authored by a bot, so the probe cannot come from the bot under test.
          DISCORD_TEST_SENDER_TOKEN: ${{ secrets.DISCORD_TEST_SENDER_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_APP_TOKEN: ${{ secrets.SLACK_APP_TOKEN }}
          SLACK_TEST_CHANNEL_ID: ${{ secrets.SLACK_TEST_CHANNEL_ID }}
          # A USER token (chat:write user scope). The inbound probe must come
          # from an identity that is not the bot, or the loop guard drops it.
          SLACK_TEST_USER_TOKEN: ${{ secrets.SLACK_TEST_USER_TOKEN }}
          MATRIX_HOMESERVER_URL: ${{ secrets.MATRIX_HOMESERVER_URL }}
          MATRIX_ACCESS_TOKEN: ${{ secrets.MATRIX_ACCESS_TOKEN }}
          MATRIX_USER_ID: ${{ secrets.MATRIX_USER_ID }}
          MATRIX_TEST_ROOM_ID: ${{ secrets.MATRIX_TEST_ROOM_ID }}
          MATTERMOST_BASE_URL: ${{ secrets.MATTERMOST_BASE_URL }}
          MATTERMOST_ACCESS_TOKEN: ${{ secrets.MATTERMOST_ACCESS_TOKEN }}
          MATTERMOST_TEST_CHANNEL_ID: ${{ secrets.MATTERMOST_TEST_CHANNEL_ID }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_IMAP_HOST: ${{ secrets.EMAIL_IMAP_HOST }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_TEST_RECIPIENT: ${{ secrets.EMAIL_TEST_RECIPIENT }}
          # A SECOND mailbox. The adapter drops own-address mail (EC-1), so the
          # inbound probe cannot come from the address under test.
          EMAIL_TEST_SENDER_ADDRESS: ${{ secrets.EMAIL_TEST_SENDER_ADDRESS }}
          EMAIL_TEST_SENDER_PASSWORD: ${{ secrets.EMAIL_TEST_SENDER_PASSWORD }}
          EMAIL_TEST_SENDER_SMTP_HOST: ${{ secrets.EMAIL_TEST_SENDER_SMTP_HOST }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TEST_USER_ID: ${{ secrets.LINE_TEST_USER_ID }}
          TEAMS_CLIENT_ID: ${{ secrets.TEAMS_CLIENT_ID }}
          TEAMS_CLIENT_SECRET: ${{ secrets.TEAMS_CLIENT_SECRET }}
          TEAMS_TENANT_ID: ${{ secrets.TEAMS_TENANT_ID }}
          TEAMS_TEST_CONVERSATION_ID: ${{ secrets.TEAMS_TEST_CONVERSATION_ID }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TEST_RECIPIENT: ${{ secrets.WHATSAPP_TEST_RECIPIENT }}
          SMS_BACKEND: ${{ secrets.SMS_BACKEND }}
          SMS_ACCOUNT_ID: ${{ secrets.SMS_ACCOUNT_ID }}
          SMS_AUTH_TOKEN: ${{ secrets.SMS_AUTH_TOKEN }}
          SMS_FROM_NUMBER: ${{ secrets.SMS_FROM_NUMBER }}
          SMS_TEST_RECIPIENT: ${{ secrets.SMS_TEST_RECIPIENT }}

      # Matrix needs no secret: it brings its own homeserver. matrix.org has
      # closed registration, and a self-hosted server is the honest target for a
      # federated protocol anyway. Booted here so the suite finds MATRIX_* set.
      - name: Boot the Matrix homeserver
        run: pnpm --filter @theokit/gateway-integration matrix:up

      # Same reasoning as Matrix: self-hosted software, so the server IS the
      # platform and no credential is involved. Slower to boot, hence its own step.
      - name: Boot the Mattermost server
        run: pnpm --filter @theokit/gateway-integration mattermost:up

      - name: Live suites
        # The dispatch input reaches the shell as an environment variable, never as
        # text spliced into the script. `${{ inputs.x }}` inside a run block is
        # substituted before bash sees the line, so a value containing a shell
        # metacharacter executes as code with whatever secrets this step holds.
        run: |
          if [ -n "$PLATFORM" ]; then
            pnpm --filter @theokit/gateway-integration exec vitest run "tests/$PLATFORM"
          else
            pnpm --filter @theokit/gateway-integration integration
          fi
        env:
          PLATFORM: ${{ inputs.platform }}
          INTEGRATION_LIVE: "1"
          # The platforms this job is expected to actually exercise. A skipped
          # suite is as green as a passing one, and this workflow gates release
          # (`release.yml` → `live-contracts`) — so without this, a secret that
          # gets deleted, renamed or emptied turns its platform off and lets a
          # publish through on a signal that verified nothing.
          #
          # An EXPIRED credential was never the risk: the positive connect()
          # test runs and fails loudly. This covers the credential that stops
          # being PRESENT.
          #
          # The list is what run 32446907954 measured as ready, not a wish:
          # Teams, WhatsApp and SMS have no credentials in this environment and
          # are deliberately absent — requiring them would make the gate red
          # about a gap that is already known and documented in the registry.
          #
          # Set only on this step. The readiness report above runs BEFORE the
          # Matrix and Mattermost servers boot, so those two are legitimately
          # unconfigured at that point.
          INTEGRATION_REQUIRE_PLATFORMS: "discord,email,line,matrix,mattermost,slack,telegram"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID }}
          # Telegram inbound is NOT wired here, deliberately (decided 2026-08-17,
          # re-affirmed 2026-08-22). Driving it needs TELEGRAM_TEST_SESSION — an
          # MTProto session string, which is full access to a Telegram ACCOUNT
          # rather than a scoped token — plus the TELEGRAM_API_ID / API_HASH that
          # are useless without it.
          #
          # The decision used to live only in a comment in
          # `integration/tests/telegram/live.test.ts`, while these three lines sat
          # here fully wired. That made the decision conventional: the only thing
          # enforcing it was nobody having filled the secret in, and whoever did
          # would have started shipping an account credential into CI with no
          # review and no signal. Not referencing them is what makes it structural.
          #
          # Restoring this is three lines, on the day the trade changes and against
          # a THROWAWAY account. See `integration/README.md § Running with nobody
          # watching`.
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_TEST_CHANNEL_ID: ${{ secrets.DISCORD_TEST_CHANNEL_ID }}
          # A SECOND bot in the same server. normalizeEvent drops messages
          # authored by a bot, so the probe cannot come from the bot under test.
          DISCORD_TEST_SENDER_TOKEN: ${{ secrets.DISCORD_TEST_SENDER_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_APP_TOKEN: ${{ secrets.SLACK_APP_TOKEN }}
          SLACK_TEST_CHANNEL_ID: ${{ secrets.SLACK_TEST_CHANNEL_ID }}
          # A USER token (chat:write user scope). The inbound probe must come
          # from an identity that is not the bot, or the loop guard drops it.
          SLACK_TEST_USER_TOKEN: ${{ secrets.SLACK_TEST_USER_TOKEN }}
          MATRIX_HOMESERVER_URL: ${{ secrets.MATRIX_HOMESERVER_URL }}
          MATRIX_ACCESS_TOKEN: ${{ secrets.MATRIX_ACCESS_TOKEN }}
          MATRIX_USER_ID: ${{ secrets.MATRIX_USER_ID }}
          MATRIX_TEST_ROOM_ID: ${{ secrets.MATRIX_TEST_ROOM_ID }}
          MATTERMOST_BASE_URL: ${{ secrets.MATTERMOST_BASE_URL }}
          MATTERMOST_ACCESS_TOKEN: ${{ secrets.MATTERMOST_ACCESS_TOKEN }}
          MATTERMOST_TEST_CHANNEL_ID: ${{ secrets.MATTERMOST_TEST_CHANNEL_ID }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_IMAP_HOST: ${{ secrets.EMAIL_IMAP_HOST }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_TEST_RECIPIENT: ${{ secrets.EMAIL_TEST_RECIPIENT }}
          # A SECOND mailbox. The adapter drops own-address mail (EC-1), so the
          # inbound probe cannot come from the address under test.
          EMAIL_TEST_SENDER_ADDRESS: ${{ secrets.EMAIL_TEST_SENDER_ADDRESS }}
          EMAIL_TEST_SENDER_PASSWORD: ${{ secrets.EMAIL_TEST_SENDER_PASSWORD }}
          EMAIL_TEST_SENDER_SMTP_HOST: ${{ secrets.EMAIL_TEST_SENDER_SMTP_HOST }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TEST_USER_ID: ${{ secrets.LINE_TEST_USER_ID }}
          TEAMS_CLIENT_ID: ${{ secrets.TEAMS_CLIENT_ID }}
          TEAMS_CLIENT_SECRET: ${{ secrets.TEAMS_CLIENT_SECRET }}
          TEAMS_TENANT_ID: ${{ secrets.TEAMS_TENANT_ID }}
          TEAMS_TEST_CONVERSATION_ID: ${{ secrets.TEAMS_TEST_CONVERSATION_ID }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TEST_RECIPIENT: ${{ secrets.WHATSAPP_TEST_RECIPIENT }}
          SMS_BACKEND: ${{ secrets.SMS_BACKEND }}
          SMS_ACCOUNT_ID: ${{ secrets.SMS_ACCOUNT_ID }}
          SMS_AUTH_TOKEN: ${{ secrets.SMS_AUTH_TOKEN }}
          SMS_FROM_NUMBER: ${{ secrets.SMS_FROM_NUMBER }}
          SMS_TEST_RECIPIENT: ${{ secrets.SMS_TEST_RECIPIENT }}

      # Always, even when the suites failed: a leftover container would make the
      # next run reuse a volume whose bootstrap token was already consumed.
      - name: Tear down the Matrix homeserver
        if: always()
        run: pnpm --filter @theokit/gateway-integration matrix:down

      - name: Tear down the Mattermost server
        if: always()
        run: pnpm --filter @theokit/gateway-integration mattermost:down
