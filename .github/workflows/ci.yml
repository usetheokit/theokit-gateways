name: CI

# The test suite had no CI job at all until 2026-08-17. `release.yml` ran
# install -> build -> changesets publish, `secret-scan.yml` scanned for
# credentials, and nothing anywhere invoked `pnpm test`. So the 584 tests could
# not fail a build, and every package published to npm without the suite ever
# being evaluated. The pre-commit hook declined to run them on the grounds that
# "they are cheap in CI" — a rationale that was circular, because CI did not run
# them either.
#
# This workflow closes that. It is the gate `release.yml` depends on: publishing
# happens on a push to main, and main is only reachable through a PR, which this
# runs on.

on:
  push:
    branches: [main, develop, workspace]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel on the integration branches — a cancelled run on main or develop
  # leaves a commit with no verdict, which reads the same as a passing one.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        # No `version:` here on purpose. The action reads `packageManager` from
        # package.json, which is already the single authority on the pnpm version.
        # Pinning it a second time in this file creates two places to update, and
        # once they disagree action-setup aborts with ERR_PNPM_BAD_PM_VERSION.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          # The cache key must change when the package manager does. setup-node keys the
          # pnpm store on the lockfile alone, so a pnpm 9 -> 10 bump leaves the key
          # identical and the job restores a store the new pnpm reads as inconsistent —
          # `ERR_PNPM_MISSING_PACKAGE_INDEX_FILE`, on a package the lockfile does list.
          # package.json carries `packageManager`, so including it ties the cache to the
          # pnpm that wrote it.
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json
      - run: pnpm install --frozen-lockfile

      # Every step is a hard gate: no `continue-on-error`, because a step that
      # cannot fail the build is a step that is not checking anything.
      #
      # Lint first because it needs nothing and reports in seconds. Then BUILD,
      # then typecheck — that order is not cosmetic. The adapters import
      # `@theokit/gateway`, whose type declarations are emitted by its build, so
      # `typecheck` before `build` fails on a clean checkout with "Cannot find
      # module '@theokit/gateway'". It passes locally either way, because dist/
      # is already lying around from a previous run. This workflow's very first
      # execution caught exactly that.
      - name: Lint and format check
        run: pnpm check

      - name: Build
        run: pnpm build

      # The typecheck below reads our SOURCE, which was green on all eleven packages while five of
      # them published a declaration that does not compile (#29). `skipLibCheck` is on in most
      # consumer projects, so the damage only surfaces in someone else's type-aware lint. This asks
      # the compiler about the artifact we actually ship.
      - name: Published declarations compile without skipLibCheck
        run: pnpm quality:dts-typechecks

      # The declaration and the runtime are emitted by two different tsup pipelines from one source,
      # and #29 was those pipelines disagreeing. A value declared but absent from the `.js` compiles
      # and is `undefined` when the program runs — past every other gate, into a consumer's
      # production. Nothing else here can see it.
      - name: Declarations and runtime export the same values
        run: pnpm quality:dts-parity

      # `PlatformEventRegistry` is extended by packages we do not control. The unit suite asserts the
      # guard in isolation; both defects found in review lived in the COMPOSITION instead — what
      # `keyof` yields over an index signature, and what a homomorphic mapping preserves from an
      # optional member. Neither is reachable from a test in this repository, because a
      # `declare module` applies to the whole compilation and would poison the package's own
      # typecheck rather than be observed. This gate compiles each hostile shape in its own program,
      # against the published declaration.
      - name: A third party cannot break consumers who never opted in
        run: pnpm quality:registry-augmentation

      # Three repositories share one seam and no document connected them: TheoKit owns the route and
      # the signature check, these packages own the translation, and the SDK's role is one redaction
      # helper. Measured against theokit@0.48.14, the seam was documented only in a `.d.ts` — which
      # is where someone already inside the type looks. This asserts the facts a paraphrase cannot
      # remove, and deliberately not the prose around them.
      - name: The integration story is still told
        run: pnpm quality:integration-story

      # npm verifies the signed provenance bundle against `repository.url`, and every package here
      # sets `publishConfig.provenance: true`. None of the eleven declared a repository, so a release
      # spent nine minutes on the build, the suite and the live gate before the registry refused all
      # eleven at once. Nothing about the packages had changed — npm began enforcing what it used to
      # tolerate. This asks the question in milliseconds instead of at publish.
      - name: Published packages declare the repository npm verifies
        run: pnpm quality:repository-field

      # Three questions the source typecheck cannot answer: do the imports our READMEs tell a reader
      # to write actually resolve, is any docblock stranded above another (attaching to nothing), and
      # does every published export carry documentation a consumer's editor will render.
      - name: API documentation
        run: pnpm quality:docs

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Unit and contract tests
        run: pnpm -r run test

      # `integration` deliberately has no `test` script, so the line above cannot
      # reach it — that is what stops `pnpm -r run test` from spending money and
      # posting into real chats. But the package is not all live tests: the
      # modules under `integration/src/` decide whether a webhook delivery may
      # write to `.env` and which binary the capture script executes, and those
      # are offline, fast, and exactly the kind of thing that must be verified on
      # every PR rather than nightly. `test:unit` runs those and the readiness
      # report; neither opens a socket to a platform.
      - name: Integration package — offline units
        run: pnpm --filter @theokit/gateway-integration test:unit

      # Guards this workflow against itself. If someone renames the root `test`
      # script or drops a package's test script, the suite would silently stop
      # running and every job above would still be green. This asserts that all
      # 11 packages still declare a test script.
      - name: Assert every package still runs tests
        run: |
          missing=0
          # `tools/` is a workspace member too, and its gates now carry the logic that decides
          # whether the other checks mean anything. It sits outside `packages/*`, so it would have
          # been the one member able to lose its test script unnoticed — which is the exact hole
          # this assertion exists to close.
          for pkg in packages/*/package.json tools/package.json; do
            if ! node -e "process.exit(require('./$pkg').scripts?.test ? 0 : 1)"; then
              echo "::error file=$pkg::no \"test\" script — this package is not covered by CI"
              missing=1
            fi
          done
          # `integration` is the one member that must NOT have a `test` script, and
          # is therefore the one whose coverage cannot be asserted by the loop
          # above. Its offline units hang off `test:unit` instead, so that name is
          # what gets pinned here — otherwise the step added for them can be
          # deleted and every job stays green, which is the hole this whole
          # assertion exists to close.
          if ! node -e "process.exit(require('./integration/package.json').scripts?.['test:unit'] ? 0 : 1)"; then
            echo "::error file=integration/package.json::no \"test:unit\" script — the offline units are not covered by CI"
            missing=1
          fi
          if node -e "process.exit(require('./integration/package.json').scripts?.test ? 0 : 1)"; then
            echo "::error file=integration/package.json::integration must NOT declare a \"test\" script — pnpm -r run test would spend money and post into real chats"
            missing=1
          fi
          exit $missing
