# Every third-party peer range, verified at every major it claims.
#
# A peer range is a promise about an interval, and this repository was keeping exactly one point of
# each. Measured 2026-08-31 with `@theokit/dep-check@0.9.2 floors`: the Dependency Gate exercises
# the floor of every declared range among the ORGANISATION'S OWN packages — eleven findings, all
# `@theokit/*` — and no third-party range at all. So `@mattermost/client ^9.0.0 || ^11.0.0` was
# verified at 11.9.0 and never at 9.x, and two adapters declared a range with no devDependency, so
# what their suite ran against was whatever pnpm's peer auto-install happened to pick.
#
# This is a separate workflow rather than a job in ci.yml because it answers a different question on
# a different clock. CI asks "does this commit work"; this asks "is the interval we promised still
# true", and the answer only changes when a range changes or a dependency publishes a new major.
#
# NOT a required check, deliberately. It reinstalls the tree once per combination, so it is minutes
# rather than seconds, and making it required would put every unrelated pull request behind a wait
# that protects nothing on that pull request. The `paths:` filter is safe HERE for the same reason:
# nothing downstream is blocked when it does not run. That is the opposite of dep-check.yml, which
# is required and therefore carries no filter — a required check that never runs deadlocks forever.
name: Peer majors

on:
  pull_request:
    # The claim only moves when a manifest moves.
    paths:
      - "packages/*/package.json"
      - "scripts/peer-majors.mjs"
      - "scripts/check-peer-major.mjs"
      - ".github/workflows/peer-majors.yml"
  schedule:
    # Weekly, because the other way this breaks is a dependency publishing a new major while every
    # file here stays exactly as it was. Monday 06:00 UTC — a finding lands at the start of a week,
    # not into a Friday evening.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peer-majors-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  derive:
    name: derive the combinations
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.derive.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - id: derive
        # Exits non-zero on a range it cannot parse, so a declaration that would silently vanish
        # from the matrix fails here instead of being quietly excluded from the promise.
        run: |
          matrix="$(node scripts/peer-majors.mjs --matrix)"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          node scripts/peer-majors.mjs

  verify:
    name: ${{ matrix.pkg }} @ ${{ matrix.dep }}@${{ matrix.version }}
    needs: derive
    runs-on: ubuntu-latest
    strategy:
      # Every combination runs. One failing major is a real finding about that major, and cancelling
      # its siblings would hide which of the others also fail — turning one report into several runs.
      fail-fast: false
      matrix: ${{ fromJSON(needs.derive.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: verify
        # typecheck + test + build at that major. This proves the COMPILE-TIME and PACKAGING
        # contract — a removed export, a changed signature, a type that stopped being assignable.
        # It does not exercise runtime behaviour; the live contracts under `integration/` do that,
        # and they run at one version. A green matrix means the code still compiles and packages
        # against that major, not that the platform still answers the same way.
        #
        # The matrix values reach the shell as ENVIRONMENT, never as template expansion into the
        # script. They are derived from `packages/*/package.json`, and this workflow runs on
        # `pull_request` — so a fork could rename a peer dependency to shell and have it expanded
        # here. Passing them as env makes them data to the shell instead of source code.
        env:
          PEER_PKG: ${{ matrix.pkg }}
          PEER_DEP: ${{ matrix.dep }}
          PEER_VERSION: ${{ matrix.version }}
        run: node scripts/check-peer-major.mjs "$PEER_PKG" "$PEER_DEP" "$PEER_VERSION"
